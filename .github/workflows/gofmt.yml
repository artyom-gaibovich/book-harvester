name: gofmt

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы (запусти gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
